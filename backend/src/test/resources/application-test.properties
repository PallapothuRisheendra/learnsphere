spring.datasource.url=jdbc:h2:mem:learnsphere-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.security.jwt-secret=test-only-secret-with-at-least-32-bytes
app.cors.allowed-origins=http://localhost:5173
app.auth.require-email-verification=false
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
