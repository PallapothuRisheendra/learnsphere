spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learnsphere}
spring.datasource.username=${DATABASE_USERNAME:learnsphere}
spring.datasource.password=${DATABASE_PASSWORD:learnsphere_dev_password}
app.security.jwt-secret=${JWT_SECRET:local-development-secret-replace-this-before-deploying-123456789}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
