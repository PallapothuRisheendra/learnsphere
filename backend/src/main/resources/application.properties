spring.application.name=learnsphere-api
spring.profiles.default=local
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.security.jwt-secret=${JWT_SECRET}
app.security.token-hours=${TOKEN_HOURS:12}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.mail.from=${MAIL_FROM:}
app.mail.host=${MAIL_HOST:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.payment.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
info.app.name=LearnSphere API
info.app.version=1.0.0
